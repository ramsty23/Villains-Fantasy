<style>
/* Layout: sports-app scoreboard — navy masthead with gold/powder stripe, gold-pill section strip, white score cards on sky, phone tab bar */
:root{
  --navy:#0b1f4b; --royal:#003594; --powder:#0080c6; --gold:#ffc20e; --amber:#e89400;
  --bg:#e8f3fc; --card:#ffffff; --ink:#0c1630; --muted:#5a6785; --line:#d5e2f0; --soft:#f1f7fd;
  --head:#0b1f4b; --head-ink:#ffffff; --head-mut:#9fb6dd; --strip:#003594; --badge:#0b1f4b; --win:#003594; --loss:#5a6785; --onacc:#0b1f4b;
  --f-disp:"Archivo","Arial Black","Helvetica Neue",Arial,sans-serif;
  --f-ui:"Archivo","Helvetica Neue",Arial,sans-serif;
  --f-read:"Source Serif 4","Georgia","Times New Roman",serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#071431; --card:#0f2250; --ink:#eef3fb; --muted:#9fb0d0; --line:#1f3566; --soft:#0b1b42;
  --head:#050f27; --head-ink:#ffffff; --head-mut:#8ea6cf; --strip:#0b2a72; --badge:#ffc20e; --win:#ffc20e; --loss:#8ea0c3; --powder:#4fb3ec; --onacc:#0b1f4b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#071431; --card:#0f2250; --ink:#eef3fb; --muted:#9fb0d0; --line:#1f3566; --soft:#0b1b42;
  --head:#050f27; --head-ink:#ffffff; --head-mut:#8ea6cf; --strip:#0b2a72; --badge:#ffc20e; --win:#ffc20e; --loss:#8ea0c3; --powder:#4fb3ec; --onacc:#0b1f4b; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.45}
.wrap{max-width:900px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.mast{background:var(--head);color:var(--head-ink)}
header.mast .wrap{padding-block:18px 14px}
.mast .kicker{display:flex;justify-content:space-between;gap:10px;color:var(--head-mut)}
.mast h1{font:900 clamp(38px,9vw,58px)/.92 var(--f-disp);font-stretch:112%;letter-spacing:-.01em;margin:8px 0 6px;text-wrap:balance}
.mast h1 span{color:var(--gold);display:block}
.mast p{margin:0;color:var(--head-mut);font-size:13px}
.stripe{height:6px;background:linear-gradient(90deg,var(--gold) 0 70%,var(--powder) 70%)}
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--strip)}
nav.tabs .wrap{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-block:9px}
nav.tabs .wrap::-webkit-scrollbar{display:none}
@media (hover:hover) and (pointer:fine){.tabs .wrap{flex-wrap:wrap;overflow-x:visible}}
nav.tabs button{flex:0 0 auto;font:700 12.5px/1 var(--f-ui);letter-spacing:.06em;text-transform:uppercase;padding:9px 12px;border-radius:999px;border:0;background:none;color:#dbe7fb;cursor:pointer}
nav.tabs button[aria-selected="true"]{background:var(--gold);color:var(--onacc)}
button:focus-visible,select:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
main{padding-block:20px 40px}
section[role=tabpanel]{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
h2{font:900 24px/1.1 var(--f-disp);font-stretch:105%;margin:0;color:var(--ink);text-wrap:balance}
h3{font:800 19px/1.2 var(--f-disp);margin:0;text-wrap:balance}
.label{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--powder);font-weight:700}
.head{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap}
.sheet{background:var(--card);border-radius:12px;padding:16px}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
/* matchups */
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:8px}
.game{background:var(--card);border-radius:12px;padding:10px 12px;display:grid;gap:3px}
.side{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:10px;align-items:center;font-size:15px}
.side .tn{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side .r{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.seed{width:24px;height:24px;border-radius:6px;background:var(--badge);color:var(--gold);font-size:11.5px;font-weight:800;display:grid;place-items:center}
:root[data-theme="dark"] .seed{color:var(--onacc)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .seed{color:var(--onacc)}}
.vs{font-size:10px;font-weight:900;color:var(--amber);letter-spacing:.2em;padding-left:34px}
.finals{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,190px),1fr));gap:8px}
.fin{background:var(--card);border-radius:10px;padding:8px 10px;font-size:13px;display:grid;gap:3px;border-top:3px solid var(--powder)}
.fin div{display:flex;justify-content:space-between;gap:8px;min-width:0}
.fin span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.fin .l{color:var(--muted)} .fin .w b{color:var(--win)}
.banner{background:var(--gold);color:var(--onacc);border-radius:12px;padding:14px;display:flex;gap:12px;align-items:center;border:0;text-align:left;font:inherit;cursor:pointer;width:100%}
.banner b{display:block;font:800 16.5px/1.2 var(--f-disp)} .banner span{font-size:13px}
.seal{flex:0 0 44px;height:44px;border-radius:50%;background:var(--navy);color:var(--gold);display:grid;place-items:center;font:900 20px var(--f-disp)}
/* tables */
.tbl{overflow-x:auto;border-radius:12px;background:var(--card)}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:14px}
table.wide{min-width:520px}
th{background:var(--navy);color:var(--gold);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;padding:10px 8px;text-align:right;white-space:nowrap}
td{padding:9px 8px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:nth-child(2),td:nth-child(2){text-align:left}
td:first-child,th:first-child{text-align:center;width:34px}
td:first-child{font-weight:800;color:var(--powder)}
tr.cut td{border-bottom:3px solid var(--gold)}
.tm b{display:block;font-weight:700} .tm span{font-size:12px;color:var(--muted)}
.pill{display:inline-block;font-size:11px;font-weight:800;padding:2px 8px;border-radius:999px;background:var(--soft)}
.pill.W{color:var(--win)} .pill.L{color:var(--loss)}
.records{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:8px}
.rec-card{background:var(--card);border-radius:12px;padding:12px;display:grid;gap:2px;border-left:4px solid var(--gold)}
.rec-card .big{font:900 26px var(--f-disp);font-variant-numeric:tabular-nums;color:var(--win)}
/* editorial */
.oscar{display:flex;gap:12px;align-items:center}
.prose{font-family:var(--f-read);font-size:17px;line-height:1.55;max-width:65ch}
.prose p{margin:0 0 .7em}.prose p:last-child{margin-bottom:0}
.list{background:var(--card);border-radius:12px;padding:0 14px}
.rank{display:grid;grid-template-columns:48px minmax(0,1fr);gap:10px;padding:14px 0;border-bottom:1px solid var(--line)}
.rank:last-child{border-bottom:0}
.rank .n{font:900 38px/.9 var(--f-disp);color:var(--powder);text-align:center}
.rank:first-child .n{color:var(--amber)}
.rank .mv{display:block;text-align:center;font:700 11px/1.2 var(--f-ui);color:var(--muted);margin-top:5px}
.rank .mv.up{color:#1d8a52} .rank .mv.dn{color:#c2414b}
.rank .t{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;min-width:0}
.rank .t b{font-size:16.5px}
.story{padding:16px 0;border-bottom:1px solid var(--line);display:grid;gap:8px}
.story:last-child{border-bottom:0}
.score-line{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--powder);font-variant-numeric:tabular-nums}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chips button{font:700 12px/1 var(--f-ui);padding:8px 12px;border-radius:999px;border:0;background:var(--card);color:var(--ink);cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--navy);color:var(--gold)}
.empty{background:var(--card);border:2px dashed var(--line);border-radius:12px;padding:22px;text-align:center;color:var(--muted);font-size:15px}
.pick{display:inline-block;font-size:11.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;background:var(--gold);color:var(--onacc);padding:4px 9px;border-radius:999px}
/* trade */
.trade{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:620px){.trade{grid-template-columns:1fr}}
.trade .col{display:grid;gap:8px;align-content:start;min-width:0}
select,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;width:100%;box-sizing:border-box}
.plist{display:grid;gap:2px;max-height:340px;overflow:auto;border-radius:12px;padding:6px;background:var(--card)}
.plist label{display:grid;grid-template-columns:auto 34px minmax(0,1fr) auto;gap:8px;align-items:center;padding:6px;border-radius:8px;cursor:pointer}
.plist label:hover{background:var(--soft)}
.pos{font-size:11px;font-weight:800;color:var(--powder)}
.meter{height:12px;background:var(--soft);border-radius:999px;overflow:hidden;display:flex}
.meter i{display:block;height:100%}
.btn{font:800 13px/1 var(--f-ui);letter-spacing:.06em;text-transform:uppercase;padding:12px 16px;border-radius:10px;border:0;background:var(--navy);color:var(--gold);cursor:pointer}
.btn.alt{background:var(--gold);color:var(--onacc)}
.btn:disabled{opacity:.45;cursor:default}
/* talk */
.post{display:grid;gap:4px;padding:12px 0;border-bottom:1px solid var(--line)}
.post:last-child{border-bottom:0}
.post .who{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.post .who b{color:var(--powder)}
.post .txt{font-size:16px;white-space:pre-wrap;overflow-wrap:anywhere}
.linkbtn{background:none;border:0;padding:0;color:var(--powder);font:700 12px/1.2 var(--f-ui);letter-spacing:.08em;text-transform:uppercase;cursor:pointer}
.trophy{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:center;background:var(--navy);color:#fff;border-radius:12px;padding:16px}
.trophy .label{color:var(--gold)} .trophy .muted{color:#c8d6ee}
.trophy .cup{font:900 44px/1 var(--f-disp);color:var(--gold)}
/* history + cabinet */
